[package]
name = "asyncffi"
version = "3.5.2"
edition = "2024"

[lib]
name = "ffihttp"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
httprs_core = { path = "../core" }
http = { path = "../http" }
# quinn = { version = "=0.11.9", features = ["aws-lc-rs"] }
tokio = "=1.52.3"
rustls = { version = "=0.23.41", default-features = false, features = [] }
tokio-rustls = "=0.26.4"
webpki-roots = "=1.0.8"
rand = "=0.10.1"
dashmap = "=6.2.1"
# rustls-pki-types = "=1.14.0"

[features]
default = []

unix-sockets = []

ring = ["rustls/ring"]
aws-lc-rs = ["rustls/aws-lc-rs"]
